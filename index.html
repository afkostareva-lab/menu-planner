<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Меню и покупки</title><style>body{font:16px system-ui;background:#f3f6f1;color:#253c2d;margin:0}main{max-width:750px;margin:auto;padding:16px}article,details{background:white;padding:16px;border-radius:15px;margin:12px 0}select,textarea,input[type=text]{width:100%;box-sizing:border-box;padding:12px;font:16px system-ui;border:1px solid #ccd8cc;border-radius:9px}label{display:block;margin:12px 0 5px}button,a{display:inline-block;padding:12px;background:#35684c;color:white;border:0;border-radius:10px;font:inherit;text-decoration:none}nav{position:sticky;top:0;background:#f3f6f1;padding:10px 0;display:flex;gap:8px}.item{display:flex;gap:12px;margin:16px 0}.item input{width:24px;height:24px;flex-shrink:0;accent-color:#35684c}small{display:block;color:#65776b}.done{opacity:.5;text-decoration:line-through}textarea{min-height:80px}summary{cursor:pointer}h1{font-size:26px}h2{font-size:21px}</style><main><h1>Меню → покупки</h1><p>Выбирайте блюда: продукты пересчитываются автоматически и объединяются без повторов.</p><nav><a href="#menu">Меню</a><a href="#shop">Покупки</a><a href="#recipes">Блюда</a></nav><small id="status"></small><section id="menu"></section><section id="shop"></section><section id="recipes"></section><p>Изменения сохраняются только в этом браузере. Автоматической синхронизации между телефонами нет. Количества в исходном меню не указаны.</p></main><script>
const R={'гренки':'яйца, хлеб, молоко','яичные пирожки':'яйца вареные, творог, сыр, можно ветчину','скрембл в тортилье':'тортилья ВВ, сыр, яйцо, помидор, можно ветчину или жареную курицу','сырники':'творог, рисовая мука, сметана','гречка белковая':'гречка, яйцо, сыр','пшенка с курагой':'пшенка, курага','круассан с рыбой':'круассан, сливочный сыр, красная рыба, листовой салат, огурец','овсянка с бананом и кедрешками':'банан, кедровые орешки','омлет с брокколи и черри':'брокколи, черри','гречка с грушей и пеканом':'груша, пекан','яичница лук/помидор':'лук, помидор','шакшука':'помидоры, болгарский перец','оладьи':'кефир, яйца, сода','борщ':'капуста, свекла, лимон','с цветной капустой':'цветная капуста, укроп, помидор, лук, картошка','суп-пюрэ с брокколи':'брокколи, сельдерей','тыквенный':'тыква, тимьян, батат','рассольник':'перловка, соленые огурцы','чечевичный':'чечевица, помидор, чеснок, сельдерей, лук, болг перец','гороховый':'горох, бекон','рамен':'лук, морковь, сельдерей, болг перец, куриные части, лапша, зелень, можно грибы','гречневый':'гречка, лук, морковь','куриные фаланги':'фаланги, вешенки, батат, брокколи/цв.капуста, черри, баклажан','стейки из индейки':'индейка, горчица, либо соевый соус','котлеты':'фарш','курица целая':'курица','мясо по французски':'мясо, помидор, картошка, лук','плов':'рис, зира, мясо, лук, морковь, барбарис','желудки':'желудки','голени индейки':'голени индейки','курица в розмарине':'филе, лимон, чеснок','фарш - болоньезе':'фарш, помидоры, сельдерей, лук, морковка, можно томат паста','жареные курбедра':'бедра кур без кости','томленая индейка':'бедро индейки, чеснок','креветки':'креветки, укроп, чеснок','лазанья':'','свиные ребра':'соевый соус, ребра, мед','жульен':'курица, грибы, сливки, сыр, лук','гедза':'гедза вв','тушеная капуста':'капуста белокочанная','гречка':'проверь гречку','рис':'проверь рис','картофельное пюрэ':'проверь картошку','жареная картошка':'проверь картошку','макароны':'проверь макароны','овощи из духовки':'батат, баклажан, черри, лук, чеснок, капуста цв','брокколи':'брокколи','киноа':'проверь киноа','ячневая':'проверь ячневую','салат':'огурцы, помидоры, кинза','свекла с чесноком':'свекла, чеснок проверь','паштет':'куриная печень, яблоко, болг перец, яйца, лук, чеснок','витаминный салат':'капуста, болг перец, огурец, лимон, яблочный уксус, укроп, морковь','макароны с томатом':'макароны, петрушка, томат, чеснок','квашеная капуста':'капуста ВВ','овощное рагу с горошком':'батат, баклажан, перец, лук, помидоры, горошек'};
const O=[['пшенка с курагой','круассан с рыбой','овсянка с бананом и кедрешками','омлет с брокколи и черри','гречка с грушей и пеканом','яичница лук/помидор','шакшука','гренки','сырники','яичные пирожки','гречка белковая','скрембл в тортилье','оладьи'],['борщ','с цветной капустой','суп-пюрэ с брокколи','тыквенный','рассольник','чечевичный','гороховый','рамен','гречневый'],['куриные фаланги','стейки из индейки','котлеты','курица целая','мясо по французски','плов','желудки','голени индейки','курица в розмарине','фарш - болоньезе','жареные курбедра','томленая индейка','креветки','лазанья','свиные ребра','жульен','гедза'],['тушеная капуста','гречка','рис','картофельное пюрэ','жареная картошка','макароны','овощи из духовки','брокколи','киноа','ячневая','салат','свекла с чесноком','паштет','витаминный салат','макароны с томатом','квашеная капуста','овощное рагу с горошком']];
let S={r:R,o:O,check:{},extra:[],days:[['гренки','гречневый','жареные курбедра','овощное рагу с горошком'],['яичные пирожки','борщ','фарш - болоньезе','овощное рагу с горошком'],['скрембл в тортилье','борщ','фарш - болоньезе','макароны'],['сырники','чечевичный','мясо по французски',''],['гречка белковая','чечевичный','мясо по французски',''],['','','плов',''],['','','плов','']]};try{let old=localStorage.getItem('meal-site-v1');if(old)S=JSON.parse(old)}catch(e){}
function el(tag,text){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}function save(){try{localStorage.setItem('meal-site-v1',JSON.stringify(S));document.getElementById('status').textContent='Сохранено в этом браузере'}catch(e){document.getElementById('status').textContent='Браузер не разрешает сохранение'}}
function menu(){let box=document.getElementById('menu');box.replaceChildren();box.append(el('h2','Меню · 11–17 октября 2026'));S.days.forEach((d,i)=>{let a=el('article');a.append(el('h2',['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'][i]+' · '+(11+i)+'.10'));d.forEach((v,j)=>{a.append(el('label',['Завтрак','Обед · суп','Ужин','Гарнир'][j]));let s=el('select');['',...S.o[j]].forEach(n=>{let o=el('option',n||'— Не выбрано —');o.value=n;s.append(o)});s.value=v;s.onchange=()=>{d[j]=s.value;save();shop()};a.append(s)});box.append(a)})}
const A={'яйцо':'яйца','яйца вареные':'яйца','морковка':'морковь','помидор':'помидоры','болг перец':'болгарский перец','перец':'болгарский перец','черри':'помидоры черри','капуста белокочанная':'капуста','капуста цв':'цветная капуста','гречку':'гречка','картошку':'картошка','ячневую':'ячневая'};
function shop(){let box=document.getElementById('shop');box.replaceChildren();let map=new Map,unknown=[];[...new Set(S.days.flat().filter(Boolean))].forEach(d=>{if(!S.r[d]){unknown.push(d);return}S.r[d].split(',').forEach(raw=>{let name=raw.trim().toLowerCase(),note='';if(name.startsWith('проверь ')){name=name.slice(8);note='Проверить дома'}if(name.endsWith(' проверь')){name=name.slice(0,-8);note='Проверить дома'}if(name.startsWith('можно ')){name=name.slice(6);note='Необязательно'}if(name.startsWith('либо ')){name=name.slice(5);note='Альтернатива'}name=A[name]||name;if(!name)return;if(!map.has(name))map.set(name,{d:new Set,n:new Set});map.get(name).d.add(d);if(note)map.get(name).n.add(note)})});S.extra.forEach(n=>{n=A[n]||n;if(!map.has(n))map.set(n,{d:new Set(['Вручную']),n:new Set})});box.append(el('h2','Покупки · '+map.size+' позиций'));let a=el('article');[...map.keys()].sort((a,b)=>a.localeCompare(b,'ru')).forEach(n=>{let row=el('div');row.className='item';let c=el('input');c.type='checkbox';c.checked=!!S.check[n];let text=el('div',n);if(c.checked)text.className='done';text.append(el('small',[...map.get(n).n].join(' · ')));text.append(el('small','Для: '+[...map.get(n).d].join(', ')));c.onchange=()=>{S.check[n]=c.checked;save();shop()};row.append(c,text);a.append(row)});let b=el('button','+ Продукт');b.onclick=()=>{let n=prompt('Название продукта');if(n&&n.trim()){S.extra.push(n.trim().toLowerCase());save();shop()}};a.append(b);box.append(a);if(unknown.length)box.append(el('p','Нет состава: '+unknown.join(', ')+'. Заполните во вкладке «Блюда».'));box.append(el('small','Необязательные ингредиенты и варианты «или» оставлены как в исходнике. Уточните состав, чтобы выбрать конкретную альтернативу.'))}
function recipes(){let box=document.getElementById('recipes');box.replaceChildren();box.append(el('h2','Блюда'));box.append(el('p','Ингредиенты через запятую. Правки сразу меняют покупки.'));let b=el('button','+ Блюдо');b.onclick=()=>{let n=prompt('Название блюда'),j=Number(prompt('1 — завтрак, 2 — обед, 3 — ужин, 4 — гарнир'))-1;if(n&&Number.isInteger(j)&&j>=0&&j<4){S.r[n]=S.r[n]||'';if(!S.o[j].includes(n))S.o[j].push(n);save();menu();recipes()}};box.append(b);Object.keys(S.r).sort((a,b)=>a.localeCompare(b,'ru')).forEach(n=>{let d=el('details');d.append(el('summary',n));let t=el('textarea');t.value=S.r[n];t.oninput=()=>{S.r[n]=t.value;save();shop()};d.append(t);box.append(d)})}menu();shop();recipes();save();
</script></html>
